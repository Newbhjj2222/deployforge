[project]
name = "deployforge-sandbox-agent"
version = "0.1.0"
description = "Trusted agent that runs untrusted build steps and application runtimes in locked-down containers."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "structlog>=24.1,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S603", "S607"]  # we deliberately shell out to the docker CLI with argv lists (never shell=True)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
